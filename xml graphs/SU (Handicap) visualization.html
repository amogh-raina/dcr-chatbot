<title>SU (Handicap) DCR Graph Visualization</title>
<style>
  :root {
    --bg: #eef3f8;
    --canvas: #f7f9fc;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #667085;
    --line: #d6dce5;
    --condition: #1d5fd0;
    --response: #c56a00;
    --include: #10833f;
    --exclude: #d32020;
    --milestone: #7338c8;
    --focus: #111827;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  header { display: grid; grid-template-columns: minmax(280px,1fr) auto; gap: 16px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 18px; line-height: 1.2; font-weight: 700; }
  .sub { margin-top: 3px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 72vw; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: end; }
  button, select, input[type="search"] { height: 32px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 6px; font: inherit; font-size: 13px; }
  button { padding: 0 10px; cursor: pointer; }
  button.active { border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); }
  input[type="search"] { width: 280px; padding: 0 10px; }
  main { display: grid; grid-template-columns: minmax(0,1fr) 340px; overflow: hidden; }
  .canvas-wrap { position: relative; overflow: hidden; background: var(--canvas); }
  svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }

  svg.group-dragging { cursor: move; }

  .section:last-child { border-bottom: 0; }
  .section h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.35; margin-top: 8px; }
  .stats { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 6px; }
  .stat { background: #f7f9fc; border: 1px solid #e6eaf0; border-radius: 6px; padding: 8px; }
  .stat strong { display: block; font-size: 17px; }
  .stat span { display: block; font-size: 11px; color: var(--muted); }
  .checks { display: grid; gap: 7px; font-size: 13px; }
  .checks label { display: flex; gap: 8px; align-items: center; }
  .legend { display: grid; gap: 6px; font-size: 13px; }
  .legend-row { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; }
  .swatch { height: 3px; border-radius: 2px; background: var(--line); }
  .details { font-size: 13px; line-height: 1.4; }
  .details h3 { margin: 0 0 8px; font-size: 16px; line-height: 1.25; }
  .details .id { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .kv { display: grid; grid-template-columns: 86px 1fr; gap: 4px 8px; margin: 8px 0; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .desc { white-space: pre-wrap; max-height: 240px; overflow: auto; padding: 8px; background: #f7f9fc; border: 1px solid #e6eaf0; border-radius: 6px; }
  .edge-list { display: grid; gap: 6px; max-height: 260px; overflow: auto; }
  .edge-item { border: 1px solid #e6eaf0; border-radius: 6px; padding: 7px; background: #f9fbfd; font-size: 12px; cursor: pointer; }
  .edge-item:hover { border-color: #aab5c4; }
  .badge { display: inline-block; border-radius: 999px; padding: 1px 7px; font-size: 11px; color: #fff; margin-right: 5px; }
  .frame rect.shell { stroke-width: 2.2; filter: url(#frameShadow); cursor: move; }
  .frame rect.header { opacity: .82; cursor: move; }
  .frame text { font-size: 11px; fill: #344054; paint-order: stroke; stroke: rgba(255,255,255,.85); stroke-width: 4px; pointer-events: none; }
  .frame.selected rect.shell { stroke: #111827; stroke-width: 3.4; }
  .frame.dimmed { opacity: .24; }
  .node rect.body { stroke-width: 1.7; filter: url(#nodeShadow); }
  .node .role-band { fill: rgba(255,255,255,.58); stroke: rgba(60,70,84,.22); stroke-width: 1; }
  .node .role { fill: #111827; font-size: 10px; font-weight: 800; }
  .node .clip-text { font-size: 10.5px; font-weight: 500; }
  .node text { pointer-events: none; fill: #172033; }
  .node .small { fill: #5b6677; font-size: 10px; }
  .node.selected rect.body { stroke: #111827; stroke-width: 3; }
  .node.dimmed { opacity: .20; }
  .edge.dimmed { opacity: .10; }
  .edge.selected path.edge-path { stroke-width: 4.8; }
  .edge-label { font-size: 10px; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; fill: #111827; pointer-events: none; }
  @media (max-width: 960px) { header { grid-template-columns: 1fr; } .toolbar { justify-content: start; } main { grid-template-columns: 1fr; grid-template-rows: 1fr 280px; } .side { border-left:0; border-top:1px solid var(--line); } input[type="search"] { width: 190px; } }
</style>
</head>

      <div class="section details" id="details"></div>
      <div class="section"><h2>Selected Edges</h2><div class="edge-list" id="edgeList"></div></div>
    </aside>
  </main>
</div>

type": "event", "parent": "A38", "depth": 1, "x": 230.0, "y": 1320.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "30", "level": "100", "eventScope": "private", "dataTypes": ["choice"], "dictionary": [{"label": "Ja", "value": "true"}, {"label": "Nej", "value": "false"}], "description": "Uddannelsessøgende, som søger handicaptillæg på baggrund af en medfødt funktionsnedsættelse, er diagnosticeret og behandlet i barndommen eller i tidlig ungdom, og disse uddannelsessøgende har ofte ikke nyere lægefaglig dokumentation, der beskriver deres aktuelle funktionsniveau. Det er i disse tilfælde især vigtigt, at den uddannelsessøgende indsender lægefaglige oplysninger om sin sygehistorik samt de seneste journalnotater vedr. funktionsnedsættelsen. Den uddannelsessøgende kan i sin personlige redegørelse beskrive den uddannelsessøgendes situation, så styrelsen kan få et bedre indblik i, hvilken betydning funktionsnedsættelsen har.\nVed medfødt funktionsnedsættelse forstås f.eks.:\n– Cerebral parese\n– Muskelsvind\n– Mental retardering\n– Autismespektrumforstyrrelse\n– Medfødt blindhed eller svagsynet\n– Svært hørehæmmet eller døv\n– Ovenstående oplistning er ikke udtømmende.\nHar den uddannelsessøgende en medfødt funktionsnedsættelse, er det vigtigt, at den uddannelsessøgende på ansøgningstidspunktet indsender de seneste lægefaglige oplysninger, som beskriver den uddannelsessøgendes udrednings- og behandlingsforløb, samt evt. aktuelle symptomer. Det kan f.eks. være epikriser, journalnoter, der beskriver sygehistorikken, herunder hvilke udfordringer den uddannelsessøgende har samt de evt. seneste afgørelser om fx bevilling af bostøtte/kontaktperson/mentor/hjælpemidler eller beskrivelser af eventuelle støtteforanstaltninger, der har været iværksat på tidligere uddannelser/arbejdspladser (skånehensyn). Er der ikke dokumentation herfor, kan det indgå i den uddannelsessøgendes personlige redegørelse.", "included": false, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A30", "label": "Behandling er afsluttet", "type": "event", "parent": "A38", "depth": 1, "x": 80.0, "y": 1020.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "26", "level": "100", "eventScope": "private", "dataTypes": ["choice"], "dictionary": [{"label": "Ja", "value": "true"}, {"label": "Nej", "value": "false"}], "description": "299", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A32", "label": "Dokumentation indeholder epikrise eller afslutningsbrev?", "type": "event", "parent": "A38", "depth": 1, "x": 250.0, "y": 1020.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "27", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "299", "included": false, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A48", "label": "Dokumentation er ikke tilstrækkelig", "type": "event", "parent": "A38", "depth": 1, "x": 230.0, "y": 1770.0, "bg": "#d9d9d9", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["LocalRobot"], "phases": [], "sequence": "42", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "343-353, 503-517\nOvenstående oplysninger skal fremsendes, hvis den uddannelsessøgende har dette tilgængeligt via journalen eller anden eksisterende lægefaglig dokumentation.\nLægefaglig dokumentation betragtes f.eks. ikke som udførlig og fyldestgørende, hvis ansøgeren alene vedlægger:\n– en erklæring fra den uddannelsessøgendes egen læge, psykiater m.v., der blot bekræfter en diagnose,\n– et medicinkort, der viser, at den uddannelsessøgende modtager medicin for en sygdom, eller\n– journaludskrift fra jobcenteret uden lægefaglige oplysninger.\n– afgørelse f.eks. fra Arbejdsmarkedets Erhvervssikring, SPS mv. uden lægefaglige oplysninger.\nAnsøgninger, hvor ovenstående gør sig gældende, vil blive afvist af styrelse uden realitetsbehandling, da minimumskravet til dokumentationen ikke er opfyldt. Læs mere herom i afsnit 6.\n----", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A51", "label": "Dokumentationen er ikke fyldestgørende (særlige tilfælde)", "type": "nesting", "parent": null, "depth": 0, "x": 700.0, "y": 1370.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": [], "phases": ["Ekstra dokumentation"], "sequence": "45", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "397\nHvis dokumentationen opfylder kravene til minimumsdokumentationen, som er beskrevet i afsnit 4, men styrelsen vurderer, at der fortsat mangler oplysninger, kan styrelsen i særlige tilfælde anmode om supplerende lægefaglige oplysninger.", "included": true, "executed": false, "pending": false, "w": 116, "h": 28, "isGroup": true}, {"id": "A53", "label": "A. vurderes at være i besiddelse af yderligere lægefaglige oplysninger", "type": "event", "parent": "A51", "depth": 1, "x": 750.0, "y": 1420.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "47", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A59", "label": "Afslag - sagen kan ikke oplyses", "type": "event", "parent": "A51", "depth": 1, "x": 1650.0, "y": 1920.0, "bg": "#d9d9d9", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["LocalRobot"], "phases": [], "sequence": "53", "level": "120", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "417", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A54", "label": "Anmod om yderligere lægefaglige oplysninger", "type": "subprocess", "parent": "A51", "depth": 1, "x": 1270.0, "y": 1420.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": [], "phases": [], "sequence": "48", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 116, "h": 28, "isGroup": true}, {"id": "A52", "label": "Anmod A. om yderligere lægefaglige oplysninger", "type": "event", "parent": "A54", "depth": 2, "x": 1300.0, "y": 1470.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "46", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "401, 407-411\n5.2. Den uddannelsessøgende anmodes om at indsende yderligere lægefaglige oplysninger\nHar den uddannelsessøgende opfyldt minimumskravet til dokumentationen, jf. afsnit 4.1, men styrelsen vurderer, at dokumentationen ikke er tilstrækkelig til, at styrelsen kan træffe afgørelse om handicaptillæg, kan styrelsen i første omgang bede den uddannelsessøgende om at indsende yderligere lægefaglige oplysninger. Det kan f.eks. være yderligere journaler fra offentligt sygehus, en redegørelse fra kommunen m.v.\nStyrelsen vil kun anmode om lægefaglige oplysninger, som styrelsen vurderer, den uddannelsessøgende allerede er i besiddelse af. Der er således tale om eksisterende dokumentation, og den uddannelsessøgende skal derfor ikke betale for udfærdigelse af ny lægefaglig dokumentation.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "frist", "label": "Fastsæt frist", "type": "event", "parent": "A54", "depth": 2, "x": 1300.0, "y": 1670.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "49", "level": "100", "eventScope": "private", "dataTypes": ["date"], "dictionary": [], "description" ", "roles": ["Praktiserende læge"], "phases": [], "sequence": "57", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A64", "label": "Returner lægeattest", "type": "event", "parent": "A60", "depth": 2, "x": 1330.0, "y": 1920.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Praktiserende læge"], "phases": [], "sequence": "58", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A61", "label": "Der kan indhentes lægeattest", "type": "event", "parent": "A51", "depth": 1, "x": 760.0, "y": 1870.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "55", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "I de tilfælde, hvor styrelsen ikke kan vurdere den uddannelsessøgendes funktionsniveau ud fra den indsendte dokumentation, kan styrelsen indhente en lægeattest. I en lægeattest skal den uddannelsessøgendes praktiserende læge forholde sig til den uddannelsessøgendes funktionsevne i forhold til den funktionsnedsættelse, som den uddannelsessøgende har søgt på baggrund af. Desuden skal lægen redegøre for, hvorvidt der er behov for fortsat behandling eller henvisning til yderligere udredning eller behandling hos en specialist.\nDen uddannelsessøgende skal medvirke til undersøgelserne, da anmodning om lægeattest som udgangspunkt er med fremmøde.\nStyrelsen kan i særlige tilfælde i forbindelse med indhentning af en lægeattest indhente yderligere journaloplysninger, som omhandler funktionsnedsættelsen.\nEventuelle udgifter i forbindelse med ovenstående indhentning afholdes af styrelsen.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A72", "label": "Der kan indhentes redegørelse", "type": "subprocess", "parent": "A51", "depth": 1, "x": 730.0, "y": 2320.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": [], "phases": [], "sequence": "66", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 116, "h": 28, "isGroup": true}, {"id": "A69", "label": "Journaloplysninger indikerer et funktionstab, men funktionsniveau og påvirkning af A. er ikke beskrevet", "type": "event", "parent": "A72", "depth": 2, "x": 760.0, "y": 2370.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "63", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "449", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A70", "label": "Der er søgt om folængelse af tidsbegrænset tillæg, men foreliggende oplysniner er nu forældede", "type": "event", "parent": "A72", "depth": 2, "x": 1060.0, "y": 2370.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "64", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "451", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A71", "label": "Der er påbegyndt et behandlingsforløb samtidigt med at der er begrænsede lægelige oplysninger", "type": "event", "parent": "A72", "depth": 2, "x": 910.0, "y": 2370.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "65", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "452", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A66", "label": "Indhent redegørelse fra speciallæge el. hospital", "type": "subprocess", "parent": "A51", "depth": 1, "x": 1280.0, "y": 2320.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": [], "phases": [], "sequence": "60", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 116, "h": 28, "isGroup": true}, {"id": "A65", "label": "Anmod om yderligere oplysninger fra ekstern institution", "type": "event", "parent": "A66", "depth": 2, "x": 1310.0, "y": 2370.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "59", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "457 - 461\nEn aktuel redegørelse kræver som udgangspunkt, at den uddannelsessøgende møder op til en aftale hos speciallægen/hospitalet. Hvis lægen mener, at oplysningerne fremgår af patientjournalen og lægens kendskab til den uddannelsessøgende (f.eks. fordi det er kort tid siden, at den uddannelsessøgende har været set), kan lægen i stedet udfylde attesten på baggrund af de foreliggende oplysninger.\nStyrelsen kan i forbindelse med indhentning af en aktuel redegørelse indhente yderligere journaloplysninger, som omhandler funktionsnedsættelsen.\nStyrelsen betaler eventuelle udgifter i forbindelse med ovenstående indhentning.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A62", "label": "Ekstern institution returnerer redegørelse", "type": "event", "parent": "A66", "depth": 2, "x": 1480.0, "y": 2370.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Ekstern institution"], "phases": [], "sequence": "56", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A73", "label": "A. medvirker ikke til undersøgelser", "type": "event", "parent": "A66", "depth": 2, "x": 1650.0, "y": 2370.0, "bg": "#f4cccc", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Ekstern institution"], "phases": [], "sequence": "67", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A67", "label": "Indhent speciallægeerklæring", "type": "event", "parent": "A51", "depth": 1, "x": 1260.0, "y": 2170.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "61", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "477 \nStyrelsen betaler eventuelle udgifter i forbindelse med ovenstående indhentning.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A74", "label": "Der kan indhentes speciallægerklæring", "type": "event", "parent": "A51", "depth": 1, "x": 760.0, "y": 2170.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "68", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "465\nStyrelsen kan i særlige tilfælde anmode om en speciallægeerklæring. Styrelsen anmoder herom, hvis den lægefaglige dokumentation, der er indsendt, ikke i tilstrækkelig grad beskriver arten og graden af den uddannelsessøgendes funktionsnedsættelse.\nStyrelsen anmoder f.eks. om en speciallægeerklæring, hvis:\n– de lægefaglige oplysninger er mangelfulde i forhold til beskrivelser af symptomernes intensitet og hyppighed,\n– der er diskrepans i mellem de lægefaglige oplysninger og den uddannelsessøgendes beskrivelser af udfordringer/symptomer,\n– der er stor tvivl om behandlingsmuligheder og prognose, eller\n– der er stor tvivl om den uddannelsessøgendes daglige funktionsniveau versus den uddannelsessøgendes funktionsniveau i ferieperioder.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A68", "label": "Indhent udtalelse fra Arbejdsmarkedets Erhvervssikring", "type": "event", "parent": "A51", "depth": 1, "x": 780.0, "y": 2620.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "62", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "481-487, 491\nStyrelsen kan til brug for behandling af en ansøgning anmode Arbejdsmarkedets Erhvervssikring om en vejledende udtalelse om den uddannelsessøgendes evne til at arbejde. Udtalelsen udarbejdes på baggrund af den foreliggende dokumentation i sagen, og kræver ikke en undersøgelse af den uddannelsessøgende.\nArbejdsmarkedets Erhvervssikring foretager en vurdering af:\nhvor meget den uddannelsessøgendes funktionsnedsættelse påvirker den uddannelsessøgendes evne til at arbejde, og\nom den uddannelsessøgendes funktionsevne er så nedsat, at denne ikke kan have et studiejob.\nStyrelsen betaler eventuelle udgifter i forbindelse med ovenstående indhentning.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A76", "label": "Godkend ansøgning", "type": "nesting", "parent": null, "depth": 0, "x": 2400.0, "y": 870.0, "bg": "#f9f7ed", "stroke": "#93c47d", "textStroke": "#000000", "roles": [], "phases": ["Afslutning"], "sequence": "69", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 116, "h": 28, "isGroup": true}, {"id": "A94", "label": "Godkend", "type": "subprocess", "parent": "A76", "depth": 1, "x": 2600.0, "y": 920.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": [], "phases": [], "sequence": "88", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 96, "h": 28, "isGroup": true}, {"id": "A84", "label": "Godkend", "type": "event", "parent": "A94", "depth": 2, "x": 2630.0, "y": 970.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "76", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 104, "h": 86, "isGroup": false}, {"id": "godkend_limit", "label": "Godkend tidsbegrænset handicap-tillæg", "type": "event", "parent": "A94", "depth": 2, "x": 2630.0, "y": 1120.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "74", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "547\nEt tidsbegrænset handicaptillæg betyder, at det på afgørelsestidspunktet er sandsynliggjort, at arten og graden af den uddannelsessøgendes funktionsnedsættelse er varig, men at dette ikke er endeligt fastslået. Handicaptillægget vil således blive tildelt fra ansøgningstidspunktet til en given dato i fremtiden.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "limit", "label": "Fastsæt tidsbegrænsing", "type": "event", "parent": "A76", "depth": 1, "x": 2430.0, "y": 1120.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "75", "level": "100", "eventScope": "private", "dataTypes": ["datetime"], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A87", "label": "Ansøg om forlængelse af handicaptillæg", "type": "event", "parent": "A76", "depth": 1, "x": 2850.0, "y": 1170.0, "bg": "#cfe2f3", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Ansøger"], "phases": [], "sequence": "78", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "553, 555\nDen uddannelsessøgende skal vedlægge den nyeste aktuelle lægefaglig dokumentation for funktionsnedsættelsen i sin ansøgning. Det er vigtigt, at dokumentationen er nyere end den, som styrelsen allerede har modtaget eller indhentet i forbindelse med behandling af ansøgningen. Det kan for eksempel være de nyeste journaler fra den uddannelsessøgendes behandlingsforløb eller en epikrise fra et afsluttet behandlingsforløb. Se i øvrigt afsnit 4 om dokumentation.\nDen uddannelsessøgende kan i sin personlige redegørelse beskrive dennes forløb siden sidste ansøgning.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A85", "label": "Afsend svarbrev", "type": "event", "parent": null, "depth": 0, "x": 3150.0, "y": 1020.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "77", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "549\nHvis den uddannelsessøgende har fået tildelt tidsbegrænset handicaptillæg, vil den periode, den uddannelsessøgende er tildelt handicaptillæg, fremgå af det brev, som den uddannelsessøgende modtager med selve afgørelsen.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A89", "label": "Afvisninger", "type": "nesting", "parent": null, "depth": 0, "x": 2400.0, "y": 20.0, "bg": "#f9f7ed", "stroke": "#f4cccc", "textStroke": "#000000", "roles": [], "phases": ["Afslutning"], "sequence": "87", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 116, "h": 28, "isGroup": true}, {"id": "A77", "label": "Afvisning mulig", "type": "event", "parent": "A89", "depth": 1, "x": 2430.0, "y": 70.0, "bg": "#d9d9d9", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["LocalRobot"], "phases": [], "sequence": "70", "level": "120", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A33", "label": "Ansøgningen afvist med realitestbehandling", "type": "event", "parent": "A89", "depth": 1, "x": 2650.0, "y": 70.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "28", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A50", "label": "Henvis til mulighed for ekstra klip ved ulykke og manglende varighed", "type": "event", "parent": "A89", "depth": 1, "x": 2850.0, "y": 70.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "44", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "391", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A82", "label": "Klage (inden 4 uger)", "type": "event", "parent": "A89", "depth": 1, "x": 2850.0, "y": 220.0, "bg": "#cfe2f3", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Ansøger"], "phases": [], "sequence": "79", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "585 \nAfgørelser om afslag på handicaptillæg, tildeling af et tidsbegrænset handicaptillæg og afvisning af en ansøgning vedrørende handicaptillæg kan den uddannelsessøgende inden for en frist på 4 uger indbringe for Ankenævnet for Statens Uddannelsesstøtteordninger.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A83", "label": "Udskyd klagefrist (op til 6 mdr efter afg.)", "type": "event", "parent": "A89", "depth": 1, "x": 2850.0, "y": 420.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "80", "level": "100", "eventScope": "private", "dataTypes": ["datetime"], "dictionary": [], "description": "Det er den uddannelsessøgendes eget ansvar, at klagen kommer rettidigt frem. Ankenævnet for Statens Uddannelsesstøtteordninger kan afvise at behandle en klage, der er modtaget for sent. Ankenævnet for Statens Uddannelsesstøtteordninger kan i visse tilfælde se bort fra overskridelse af klagefristen. Det kan ske op til seks måneder efter, den uddannelsessøgende har modtaget afgørelsen, og hvis overskridelse af fristen af særlige grunde er undskyldelig. Det er Ankenævnet for Statens Uddannelsesstøtteordninger, der vurderer, om der foreligger undskyldelige forhold. Derfor kan styrelsen ikke tage stilling til dette.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A93", "label": "Afvis uden realitetsbehandling", "type": "event", "parent": "A89", "depth": 1, "x": 2630.0, "y": 420.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "86", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A78", "label": "Afvist uden realitetsbehandling mulig", "type": "event", "parent": "A89", "depth": 1, "x": 2450.0, "y": 420.0, "bg": "#d9d9d9", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["LocalRobot"], "phases": [], "sequence": "71", "level": "120", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A79", "label": "Klag over afvisning uden realitetsbehandling", "type": "event", "parent": "A89", "depth": 1, "x": 2630.0, "y": 620.0, "bg": "#cfe2f3", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Ansøger"], "phases": [], "sequence": "72", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "521\nDen uddannelsessøgende har mulighed for at klage over afvisningen til Ankenævnet for Statens Uddannelsesstøtteordninger. Klagen skal sendes til styrelsen. Det er vigtigt at være opmærksom på, at en klage over en afvisning alene vil omhandle spørgsmålet, om styrelsen var berettiget til at afvise ansøgningen, og ikke om den uddannelsessøgende er eller var berettiget til handicaptillæg. Se afsnit 9 om hvordan man klager over en afgørelse om handicaptillæg.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A95", "label": "Realitetsbehandling", "type": "nesting", "parent": null, "depth": 0, "x": 1000.0, "y": 20.0, "bg": "#f1f6fe", "stroke": "#cccccc", "textStroke": "#000000", "roles": [], "phases": [], "sequence": "89", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 116, "h": 28, "isGroup": true}, {"id": "A3", "label": "A. har en varig fysisk eller psykisk funktionsnedsættelse, der indebærer meget betydelige begræsninger i evnen til at påtage sig erhvervsarbejde", "type": "subprocess", "parent": "A95", "depth": 1, "x": 1450.0, "y": 70.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": [], "phases": ["Funktionsnedsættelse"], "sequence": "2", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 116, "h": 28, "isGroup": true}, {"id": "A9", "label": "3.4.2 Funktionsnedsættelsen er varig", "type": "subprocess", "parent": "A3", "depth": 2, "x": 1480.0, "y": 120.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": [], "phases": [], "sequence": "8", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "176", "included": true, "executed": false, "pending": false, "w": 116, "h": 28, "isGroup": true}, {"id": "A11", "label": "Funktionsnedsættelsen vil hverken af sig selv eller ved behandling blive væsentlig bedre indenfor en længere årrække.´", "type": "event", "parent": "A9", "depth": 3, "x": 1510.0, "y": 170.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "10", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "178\n190-212:\nEksempler på varige funktionsnedsættelser (listen er ikke udtømmende):\nVarige fysiske funktionsnedsættelser:\n– Bevægelsesvanskeligheder som følge af svære muskel- og nervelidelser, f.eks. muskelsvind, sklerose, svære ryglidelser, cerebral parese.\n– Blinde og stærkt svagsynede.\n– Døve og svært hørehæmmede.\nVarige psykiske funktionsnedsættelser:\n– Svære psykiske vanskeligheder f.eks. som følge af personlighedsforstyrrelse, spiseforstyrrelse, OCD eller angst.\n– Lidelser inden for det skizofrene spektrum.\n– Affektive lidelser, herunder bipolar sindslidelse, periodisk depression.\n– Opmærksomhedsforstyrrelse og autismespektrumforstyrrelse.\nDet betyder ikke, at enhver uddannelsessøgende med en varig funktionsnedsættelse som dem, der er nævnt ovenfor, uden videre vil være berettiget til at modtage handicaptillæg. Tilsvarende vil andre funktionsnedsættelser end de nævnte eventuelt kunne danne grundlag for tildeling. Listen er som nævnt ikke udtømmende.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A12", "label": "Funktionsnedsættelsen er ikke varig, men har nu haft en varighed på mindst  et år", "type": "event", "parent": "A9", "depth": 3, "x": 1680.0, "y": 170.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "11", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "214", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A10", "label": "Funktionsnedsættelsen er ikke varig", "type": "event", "parent": "A9", "depth": 3, "x": 1850.0, "y": 170.0, "bg": "#f4cccc", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "9", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "214\n216:\nFunktionsnedsættelser, som pr. definition ikke er varige, er f.eks. enkeltstående depression, en brækket arm, en enkeltstående operation, graviditetsbetinget sygdom, forværring af anden lidelse pga. graviditet eller en enkeltstående sygdomsperiode. Disse forhold vil ikke berettige til handicaptillæg, da de fleste kommer sig fuldstændigt inden for en overskuelig periode. Oplistningen er ikke udtømmende.\n525-529 \nEn uddannelsessøgende vil få afslag på sin ansøgning, hvis den dokumentation, den uddannelsessøgende har vedlagt på ansøgningstidspunktet, ikke viser, at den uddannelsessøgende har en varig funktionsnedsættelse.\nDet er f.eks. tilfældet, hvis den uddannelsessøgende søger på baggrund af en funktionsnedsættelse, der pr. definition ikke er varig, herunder søger på baggrund af en brækket arm, en enkeltstående operation, en enkeltstående sygdomsperiode eller graviditetsrelaterede gener, som ikke berettiger til handicaptillæg, da de fleste kommer sig fuldstændig inden for en overskuelig periode.\nDet er heller ikke muligt at ansøge om et tidsbegrænset handicaptillæg for en kort periode, fordi den uddannelsessøgende, f.eks. på grund af en operation, er sygemeldt fra sit studie i f.eks. 2 måneder. Se afsnit 7.2. om tidsbegrænset handicaptillæg. En ansøgning herom vil derfor heller ikke blive imødekommet, idet der ikke er tale om en varig lidelse.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A91", "label": "A. har en funktionsnedsættelse", "type": "subprocess", "parent": "A3", "depth": 2, "x": 1490.0, "y": 370.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": [], "phases": [], "sequence": "84", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 116, "h": 28, "isGroup": true}, {"id": "A16", "label": "Hvis der foreligger flere funktionsnedsættelser vurderes de samlet", "type": "event", "parent": "A91", "depth": 3, "x": 1650.0, "y": 420.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "14", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "245", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A14", "label": "Funktionsnedsættelsen er velbeskrevet og  lægefagligt dokumenteret?", "type": "event", "parent": "A91", "depth": 3, "x": 1520.0, "y": 420.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "12", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "226-242\nDet indgår f.eks. i vurderingen af sværhedsgraden:\n– hvad den uddannelsessøgende fejler,\n– i hvilket omfang funktionsnedsættelsen påvirker den uddannelsessøgendes daglige funktionsniveau, og dermed kommer til udtryk,\n– om der er iværksat relevant behandling, hvilken effekt denne har, om der er beskrevet restsymptomer eller bivirkninger af behandlingen, og om den uddannelsessøgende i rimeligt omfang medvirker til behandlingen, og\n– hvor længe den uddannelsessøgende har været syg, om der er gentagne sygdomsperioder og risiko for tilbagefald.\nHvis en uddannelsessøgende f.eks. lider af hovedpine eller migræne, indgår det i vurderingen, hvor ofte den uddannelsessøgende har hovedpine, hvor slemt den uddannelsessøgende har det, når denne har hovedpine, og hvor længe hovedpineanfaldene varer.\nI forhold til sygdomshistorik indgår det f.eks. i vurderingen, hvordan den uddannelsessøgendes symptomer eller sygdom har udviklet sig over tid. Har den uddannelsessøgende f.eks. en kronisk tarmsygdom, indgår det i vurderingen af sværhedsgraden, om den uddannelsessøgende har haft gentagne behandlingskrævende sygdomsperioder, indlæggelser, hvor lang tid har de varet og behandlingseffekten.\nSelv om en behandling har effekt, herunder formindsker den uddannelsessøgendes symptomer, kan der være restsymptomer, som opfylder kriteriet om sværhedsgrad. Det kan f.eks. være, at den uddannelsessøgende har bivirkninger af den medicinske behandling, denne er opstartet i. Dette medtages således også i vurderingen, og det vil ofte være beskrevet i de lægefaglige journaler, som er udarbejdet af behandlingsstedet, og som skal vedlægges på ansøgningstidspunktet.\nDet er styrelsen, som vurderer, om der er tale om en funktionsnedsættelse af en sådan sværhedsgrad, at det medfører meget betydelige begrænsninger i den uddannelsessøgendes erhvervsevne, og dermed kan danne baggrund for tildeling af handicaptillæg.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A24", "label": "Funktionsnedsættelsen er nævnt i ansøgningen?", "type": "event", "parent": "A91", "depth": 3, "x": 1520.0, "y": 570.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "22", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "275\nDet følger af SU-bekendtgørelsens § 37, stk. 2, at styrelsen som udgangspunkt alene vurderer retten til handicaptillæg på baggrund af den eller de konkrete varige funktionsnedsættelser, som den uddannelsessøgende søger på baggrund af. Det betyder, at den uddannelsessøgende specifikt skal angive i sin ansøgning om handicaptillæg, hvilken eller hvilke funktionsnedsættelser, der søges på baggrund af.\nEr der f.eks. nævnt andre funktionsnedsættelser i den lægefaglige dokumentation, som den uddannelsessøgende har vedlagt, men har den uddannelsessøgende alene angivet én bestemt funktionsnedsættelse i sin ansøgning, vil styrelsen udelukkende vurdere den funktionsnedsættelse, der er angivet i ansøgningen, jf. SU-bekendtgørelsens § 37, stk. 2.\n277\nEr der f.eks. nævnt andre funktionsnedsættelser i den lægefaglige dokumentation, som den uddannelsessøgende har vedlagt, men har den uddannelsessøgende alene angivet én bestemt funktionsnedsættelse i sin ansøgning, vil styrelsen udelukkende vurdere den funktionsnedsættelse, der er angivet i ansøgningen, jf. SU-bekendtgørelsens § 37, stk. 2.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A25", "label": "A. opdaterer ansøgning med yderligere funktionsnedsættelser?", "type": "event", "parent": "A91", "depth": 3, "x": 1670.0, "y": 570.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Ansøger"], "phases": [], "sequence": "23", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "279\nHvis den uddannelsessøgende under behandlingen af sagen indsender fyldestgørende dokumentation for en anden varig funktionsnedsættelse, og oplyser, at den uddannelsessøgende også ønsker, at den nye funktionsnedsættelse også indgår, vil denne funktionsnedsættelse også blive inddraget i sagen. Det er således alene på den uddannelsessøgendes initiativ, at der evt. inddrages andre funktionsnedsættelser. Det forudsætter i øvrigt, at minimumskravene til dokumentation også er opfyldt for denne funktionsnedsættelse.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A81", "label": "A. ansøger pga en andens funktionedsættelse (e.g., pårørende, barn)", "type": "event", "parent": "A91", "depth": 3, "x": 1520.0, "y": 720.0, "bg": "#f4cccc", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "73", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "531\nEn uddannelsessøgende vil ligeledes få afslag på sin ansøgning, hvis den uddannelsessøgende søger på baggrund af en pårørendes eller eget barns sygdom og funktionsnedsættelse. Styrelsen har ikke hjemmel til at tildele handicaptillæg på baggrund af en anden persons funktionsnedsættelse. Handicaptillæg tilknytter sig således alene til den uddannelsessøgendes egne forhold.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A92", "label": "A. har ikke en  dokumenteret funktionsnedsættelse", "type": "event", "parent": "A91", "depth": 3, "x": 1670.0, "y": 720.0, "bg": "#d9d9d9", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["LocalRobot"], "phases": [], "sequence": "85", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A15", "label": "Funktionsnedsættelse indebærer meget betydelige begræsninger i evnen til at påtage sig erhvervsarbejde", "type": "subprocess", "parent": "A3", "depth": 2, "x": 1870.0, "y": 370.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": [], "phases": [], "sequence": "13", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "253\nEn uddannelsessøgende kan for eksempel ikke modtage handicaptillæg alene af den årsag, at denne er ordblind. Handicaptillæg gives kun til uddannelsessøgende med meget betydelige begrænsninger i deres erhvervsevne, og der er f.eks. flere typer af erhvervsarbejde, man kan bestride, selv om man har læse-/skrivevanskeligheder. Dette følger desuden af Ankenævnet for Statens Uddannelsesstøtteordningers praksis. Se i øvrigt afsnit 3.6 om forhold, der ikke indgår i styrelsens vurdering.\n267\nDer tages udelukkende stilling til, om den uddannelsessøgende vil være i stand til at varetage et erhvervsarbejde med de ressourcer, som den pågældende har. Arbejdsprøvning, særlig arbejdspladsindretning eller lignende indgår ikke. Styrelsen kontakter heller ikke nuværende eller tidligere arbejdsgivere.\n269 \nErhvervsarbejdets studierelevans, lokale forhold eller beskæftigelsessituationen indgår desuden ikke i vurderingen. Det indgår heller ikke i vurderingen, om den uddannelsessøgendes funktionsnedsættelse medfører, at denne har svært ved at finde et erhvervsarbejde, eller om det i øvrigt er muligt at finde egnet erhvervsarbejde.\n271\nVurderingen forholder sig i øvrigt alene til erhvervsevnen som uddannelsessøgende og ikke erhvervsevnen efter endt uddannelse.", "included": true, "executed": false, "pending": false, "w": 116, "h": 28, "isGroup": true}, {"id": "A17", "label": "A. er istand til i nogen grad at bestride arbejde", "type": "event", "parent": "A15", "depth": 3, "x": 1900.0, "y": 420.0, "bg": "#f4cccc", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "15", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "255\nDet indgår i vurderingen af erhvervsevnen, i hvilket omfang den uddannelsessøgende har eller har haft erhvervsarbejde. Et erhvervsarbejde kan være et hvilket som helst job, den uddannelsessøgende kan varetage. Det kan f.eks. være lagerarbejde, caféjob, butiksarbejde, sætte varer på plads i et supermarked, eller besvare telefoner i et callcenter. Hvis den uddannelsessøgende f.eks. er i stand til at arbejde 5-6 timer om ugen, herunder i weekender, eller fuldtid 5-6 uger i årets ferier, er den uddannelsessøgende som udgangspunkt ikke berettiget til handicaptillæg. Nogle uddannelser er indrettet således, at de uddannelsessøgende ikke har længere ferier. Dette inddrages i vurderingen af erhvervsevnen, hvis den uddannelsessøgende oplyser om det.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A18", "label": "Indhent oplysninger om arbejdstimer og indkomst fra skattestyrelsen", "type": "event", "parent": "A15", "depth": 3, "x": 2050.0, "y": 420.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "16", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "257", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A19", "label": "Indhent oplysninger om erhvervsarbejde fra ansøgning", "type": "event", "parent": "A15", "depth": 3, "x": 2050.0, "y": 570.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "17", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "257", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A20", "label": "A. har bestredet erhvervarbejde", "type": "event", "parent": "A15", "depth": 3, "x": 1900.0, "y": 570.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "18", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "259-261\nOplysninger om den uddannelsessøgendes erhvervsarbejde forud for ansøgningstidspunktet kan indgå i vurderingen af, om en uddannelsessøgende har ret til handicaptillæg. Det gælder navnlig, hvor arbejdsophøret ikke sker på grund af den uddannelsessøgendes funktionsnedsættelse, men andre forhold, og at der i tiden efter arbejdets ophør ikke er sket en forværring i arten og graden af funktionsnedsættelsen.\nErhvervsarbejde under studiet indgår også i vurderingen.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A21", "label": "A. har bestredet erhvervsarbejde efter funktionsnedsættelsen er indtrådt", "type": "event", "parent": "A15", "depth": 3, "x": 1900.0, "y": 720.0, "bg": "#f4cccc", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "19", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "263", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A22", "label": "A. oplyser at erhvervsarbejde er ophørt pga funktionsnedsættelsen", "type": "event", "parent": "A15", "depth": 3, "x": 1900.0, "y": 870.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "20", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "265", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": "A23", "label": "Styrelsen vurderer om A. ville kunne bestride andre typer arbejde, evt. med skånehensyn", "type": "event", "parent": "A15", "depth": 3, "x": 2050.0, "y": 870.0, "bg": "#f9f7ed", "stroke": "#cccccc", "textStroke": "#000000", "roles": ["Sagsbehandler"], "phases": [], "sequence": "21", "level": "100", "eventScope": "private", "dataTypes": [], "dictionary": [], "description": "265 \nHvis den uddannelsessøgende efter det oplyste er ophørt i arbejdet på grund af funktionsnedsættelsen, ses der på arbejdets karakter i forhold til funktionsnedsættelsen. Det vurderes i den forbindelse, om den uddannelsessøgende, ud fra sagens øvrige oplysninger, vil være i stand til at varetage andre typer af arbejde, evt. med skånehensyn eller i mindre omfang. Styrelsen inddrager derfor også i vurderingen, om den uddannelsessøgende har haft gener, som medfører skånebehov i forhold til et erhvervsarbejde, og om den uddannelsessøgende f.eks. vil kunne varetage et arbejde, der ikke er fysisk belastende.", "included": true, "executed": false, "pending": false, "w": 118, "h": 86, "isGroup": false}, {"id": const svg = document.getElementById('graph');
const viewport = document.getElementById('viewport');
const framesLayer = document.getElementById('framesLayer');
const edgesLayer = document.getElementById('edgesLayer');
const labelsLayer = document.getElementById('labelsLayer');
const nodesLayer = document.getElementById('nodesLayer');
const details = document.getElementById('details');
const edgeList = document.getElementById('edgeList');
const state = {
  scale: 1, tx: 0, ty: 0, selectedNode: null, selectedEdge: null, selectedGroup: null,
  showLabels: true, showFrames: true,
  visibleTypes: { condition: true, response: true, include: true, exclude: true, milestone: true },
  search: '', focusType: 'all', groupOffsets: {}
};
const types = {
  condition: { color: '#1d5fd0', label: 'Condition', dash: '', count: data.stats.conditions },
  response: { color: '#c56a00', label: 'Response', dash: '7 5', count: data.stats.responses },
  include: { color: '#10833f', label: 'Include', dash: '', count: data.stats.includes },
  exclude: { color: '#d32020', label: 'Exclude', dash: '3 4', count: data.stats.excludes },
  milestone: { color: '#7338c8', label: 'Milestone', dash: '10 4 2 4', count: data.stats.milestones }
};
const framePalette = ['#dcecff','#fff4d8','#e8f7ed','#ffe6e6','#efe7ff','#e3f4f4','#f4e8dc','#edf0ff'];
const nodes = new Map(data.nodes.map(n => [n.id, n]));
const frames = new Map(data.frames.map(f => [f.id, f]));
const children = {};
data.nodes.forEach(n => { if (n.parent) (children[n.parent] ||= []).push(n.id); });
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function wrapWords(text, maxChars, maxLines = 5) {
  const words = String(text || '').split(/\s+/).filter(Boolean); const lines = []; let line = '';
  for (const word of words) { const next = line ? line + ' ' + word : word; if (next.length > maxChars && line) { lines.push(line); line = word; } else line = next; if (lines.length === maxLines) break; }
  if (line && lines.length < maxLines) lines.push(line);
  if (words.join(' ').length > lines.join(' ').length && lines.length) lines[lines.length - 1] += '...';
  return lines.length ? lines : [''];
}
function ancestorsOfNode(n) { const ids = []; let p = n.parent; while (p) { ids.push(p); p = nodes.get(p)?.parent || null; } return ids.reverse(); }
function groupOffset(id) { return state.groupOffsets[id] || {x:0,y:0}; }
function cumulativeOffsetForNode(n) {
  const ids = ancestorsOfNode(n); if (n.isGroup) ids.push(n.id);
  return ids.reduce((acc,id) => { const o = groupOffset(id); acc.x += o.x; acc.y += o.y; return acc; }, {x:0,y:0});
}
function cumulativeOffsetForFrame(f) {
  const n = nodes.get(f.id); const ids = ancestorsOfNode(n); ids.push(f.id);
  return ids.reduce((acc,id) => { const o = groupOffset(id); acc.x += o.x; acc.y += o.y; return acc; }, {x:0,y:0});
}
function posNode(n) { const o = cumulativeOffsetForNode(n); return {...n, x:n.x+o.x, y:n.y+o.y}; }
function posFrame(f) { const o = cumulativeOffsetForFrame(f); return {...f, x:f.x+o.x, y:f.y+o.y}; }
function edgeKey(e, i) { return `${e.type}:${e.source}->${e.target}:${i}`; }
function markerId(type) { return `arrow-${type}`; }
function updateTransform() { viewport.setAttribute('transform', `translate(${state.tx},${state.ty}) scale(${state.scale})`); }
function addMarkers() {
  const defs = document.getElementById('defs');
  for (const [type,cfg] of Object.entries(types)) {
    const marker = document.createElementNS('http://www.w3.org/2000/svg','marker');
    marker.setAttribute('id', markerId(type)); marker.setAttribute('markerWidth','11'); marker.setAttribute('markerHeight','11'); marker.setAttribute('refX','9'); marker.setAttribute('refY','3'); marker.setAttribute('orient','auto'); marker.setAttribute('markerUnits','strokeWidth');
    const path = document.createElementNS('http://www.w3.org/2000/svg','path'); path.setAttribute('d','M0,0 L0,6 L9,3 z'); path.setAttribute('fill', cfg.color); marker.appendChild(path); defs.appendChild(marker);
  }
}
function currentBounds() {
  const xs=[], ys=[];
  data.nodes.forEach(n => { const p=posNode(n); xs.push(p.x,p.x+p.w); ys.push(p.y,p.y+p.h); });
  data.frames.forEach(f => { const p=posFrame(f); xs.push(p.x,p.x+p.w); ys.push(p.y,p.y+p.h); });
  return { minX: Math.min(...xs)-140, minY: Math.min(...ys)-140, width: Math.max(...xs)-Math.min(...xs)+280, height: Math.max(...ys)-Math.min(...ys)+280 };
}
function fit() { const rect = svg.getBoundingClientRect(); const b = currentBounds(); const pad = 35; const sx=(rect.width-pad*2)/b.width, sy=(rect.height-pad*2)/b.height; state.scale=Math.max(.08, Math.min(sx,sy)); state.tx=pad-b.minX*state.scale+(rect.width-b.width*state.scale-pad*2)/2; state.ty=pad-b.minY*state.scale+(rect.height-b.height*state.scale-pad*2)/2; updateTransform(); }
function edgePath(e, index) {
  const s0=nodes.get(e.source), t0=nodes.get(e.target); if (!s0 || !t0) return '';
  const s=posNode(s0), t=posNode(t0); const sx=s.x+s.w/2, sy=s.y+s.h/2, tx=t.x+t.w/2, ty=t.y+t.h/2;
  const dx=tx-sx, dy=ty-sy, dist=Math.max(1,Math.hypot(dx,dy)); const nx=dx/dist, ny=dy/dist;
  const startX=sx+nx*(Math.min(s.w,s.h)*.48), startY=sy+ny*(Math.min(s.w,s.h)*.48);
  const endX=tx-nx*(Math.min(t.w,t.h)*.52), endY=ty-ny*(Math.min(t.w,t.h)*.52);
  const parallel=data.edges.filter(x => x.source===e.source && x.target===e.target); const pos=parallel.indexOf(e); const offset=parallel.length>1 ? (pos-(parallel.length-1)/2)*22 : 0;
  const cx=(startX+endX)/2-ny*(34+offset), cy=(startY+endY)/2+nx*(34+offset);
  return `M ${startX} ${startY} Q ${cx} ${cy} ${endX} ${endY}`;
}
function pathMidpoint(d) { const m=d.match(/M\s+([-\d.]+)\s+([-\d.]+)\s+Q\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)/); if(!m) return [0,0]; const [,x1,y1,cx,cy,x2,y2]=m.map(Number); return [0.25*x1+0.5*cx+0.25*x2, 0.25*y1+0.5*cy+0.25*y2]; }
function matchesSearchNode(n) { if(!state.search) return true; const q=state.search.toLowerCase(); return [n.id,n.label,n.type,n.roles?.join(' '),n.phases?.join(' '),n.description].some(v => String(v||'').toLowerCase().includes(q)); }
function matchesSearchEdge(e) { if(!state.search) return true; const q=state.search.toLowerCase(); return [e.type,e.source,e.target,e.expression,e.expressionId,e.time,e.filterLevel,e.link].some(v => String(v||'').toLowerCase().includes(q)); }
function isEdgeVisible(e) { return state.visibleTypes[e.type] && (state.focusType==='all' || state.focusType===e.type) && e.knownSource && e.knownTarget; }
function selectedIncident(e) { return state.selectedNode && (e.source===state.selectedNode || e.target===state.selectedNode); }
function renderFrames() {
  framesLayer.innerHTML=''; if(!state.showFrames) return;
  data.frames.slice().sort((a,b)=>a.depth-b.depth).forEach((f,i) => {
    const p=posFrame(f); const n=nodes.get(f.id); const matched=matchesSearchNode(n); const dimmed=state.search && !matched;
    const color=framePalette[i % framePalette.length]; const header = p.depth === 0 ? '#d8e8fb' : '#f5ead5';
    const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class', `frame depth-${Math.min(2,p.depth)} ${state.selectedGroup===f.id?'selected':''} ${dimmed?'dimmed':''}`); g.dataset.groupId=f.id;
    const title=wrapWords(`${f.id} · ${f.label}`, Math.max(16, Math.floor((p.w-26)/6.2)), 1)[0];
    g.innerHTML=`<rect class="shell" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="8" fill="${color}" fill-opacity="${p.depth===0?'.62':'.42'}" stroke="${p.depth===0?'#6f8299':'#98a2b3'}"/>`+
      `<rect class="header" x="${p.x+1}" y="${p.y+1}" width="${Math.max(0,p.w-2)}" height="24" rx="7" fill="${header}"/>`+
      `<text x="${p.x+11}" y="${p.y+17}">${esc(title)}</text>`;
    g.addEventListener('pointerdown', ev => startGroupDrag(ev, f.id));
    g.addEventListener('click', ev => { ev.stopPropagation(); state.selectedGroup=f.id; state.selectedNode=f.id; state.selectedEdge=null; updateDetails(nodes.get(f.id)); render(); });
    framesLayer.appendChild(g);
  });
}
function renderEdges() {
  edgesLayer.innerHTML=''; labelsLayer.innerHTML='';
  data.edges.forEach((e,i) => {
    if(!e.knownSource || !e.knownTarget) return; const d=edgePath(e,i); const cfg=types[e.type]; const visible=isEdgeVisible(e); const matched=matchesSearchEdge(e)||matchesSearchNode(nodes.get(e.source))||matchesSearchNode(nodes.get(e.target));
    const dimmed=!visible || (state.search&&!matched) || (state.selectedNode && !selectedIncident(e));
    const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class', `edge ${dimmed?'dimmed':''} ${state.selectedEdge===edgeKey(e,i)?'selected':''}`);
    const halo=document.createElementNS('http://www.w3.org/2000/svg','path'); halo.setAttribute('d',d); halo.setAttribute('fill','none'); halo.setAttribute('stroke','#ffffff'); halo.setAttribute('stroke-opacity','.9'); halo.setAttribute('stroke-width','7'); halo.setAttribute('stroke-linecap','round'); if(cfg.dash) halo.setAttribute('stroke-dasharray',cfg.dash); g.appendChild(halo);
    const path=document.createElementNS('http://www.w3.org/2000/svg','path'); path.setAttribute('class','edge-path'); path.setAttribute('d',d); path.setAttribute('fill','none'); path.setAttribute('stroke',cfg.color); path.setAttribute('stroke-width', e.type==='milestone'?'3.4':'3.2'); path.setAttribute('stroke-linecap','round'); if(cfg.dash) path.setAttribute('stroke-dasharray',cfg.dash); path.setAttribute('marker-end',`url(#${markerId(e.type)})`); g.appendChild(path);
    g.addEventListener('click', ev => { ev.stopPropagation(); state.selectedEdge=edgeKey(e,i); state.selectedNode=null; state.selectedGroup=null; updateDetails(e,i); render(); });
    edgesLayer.appendChild(g);
    if(state.showLabels && visible && (!state.search || matched) && (e.expression || e.time || state.scale>.45)) { const [mx,my]=pathMidpoint(d); const txt=[e.expression?`[${e.expression}]`:cfg.label,e.time?`time=${e.time}`:'' ].filter(Boolean).join(' '); const label=document.createElementNS('http://www.w3.org/2000/svg','text'); label.setAttribute('class','edge-label'); label.setAttribute('x',mx+4); label.setAttribute('y',my-4); label.textContent=txt; labelsLayer.appendChild(label); }
  });
}
function renderNodes() {
  nodesLayer.innerHTML=''; let clipIndex=0;
  data.nodes.forEach(n0 => { const n=posNode(n0); const matched=matchesSearchNode(n0)||data.edges.some(e=>matchesSearchEdge(e)&&(e.source===n.id||e.target===n.id)); const dimmed=(state.search&&!matched)||(state.selectedNode&&state.selectedNode!==n.id&&!data.edges.some(e=>selectedIncident(e)&&(e.source===n.id||e.target===n.id)));
    const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class',`node ${dimmed?'dimmed':''} ${state.selectedNode===n.id?'selected':''}`); g.setAttribute('transform',`translate(${n.x},${n.y})`);
    if(n.isGroup) { const groupLabel=wrapWords(n.label, Math.max(10, Math.floor((n.w-14)/6)), 1)[0]; g.innerHTML=`<rect class="body" x="0" y="0" width="${n.w}" height="${n.h}" rx="5" fill="#ffffff" fill-opacity=".82" stroke="#98a2b3"/>`+`<text x="7" y="18" class="small" font-weight="800">${esc(n.id)}</text>`+`<text x="34" y="18" class="small">${esc(groupLabel)}</text>`; }
    else { const role=n.roles[0] || (n.type==='subprocess'?'Subprocess':'LocalRobot'); const clipId=`clip-node-${clipIndex++}`; const lines=wrapWords(n.label, Math.max(10, Math.floor((n.w-18)/5.7)), 4); const status=`${n.pending?'!':''}${n.executed?'✓':''}${!n.included?'x':''}`; let body=`<defs><clipPath id="${clipId}"><rect x="8" y="28" width="${n.w-16}" height="${n.h-35}" rx="2"/></clipPath></defs>`; body+=`<rect class="body" x="0" y="0" width="${n.w}" height="${n.h}" rx="7" fill="${esc(n.bg)}" stroke="#aeb7c4"/>`; body+=`<rect class="role-band" x="6" y="6" width="${n.w-12}" height="18" rx="3"/>`; body+=`<text class="role" x="${n.w/2}" y="19" text-anchor="middle">${esc(role)}</text>`; if(!n.included) body+=`<rect x="5" y="5" width="${n.w-10}" height="${n.h-10}" rx="5" fill="rgba(255,255,255,.45)" stroke="#9aa3af" stroke-dasharray="5 4"/>`; lines.forEach((line,idx)=>body+=`<text clip-path="url(#${clipId})" class="clip-text" x="10" y="${42+idx*13}">${esc(line)}</text>`); body+=`<text x="8" y="${n.h-7}" class="small">${esc(n.id)}</text>`; if(status) body+=`<text x="${n.w-8}" y="${n.h-7}" text-anchor="end" class="small">${esc(status)}</text>`; g.innerHTML=body; }
    g.addEventListener('click', ev => { ev.stopPropagation(); state.selectedNode=n.id; state.selectedGroup=n.isGroup?n.id:null; state.selectedEdge=null; updateDetails(n0); render(); }); nodesLayer.appendChild(g);
  });
}
function renderStats() {
  document.getElementById('title').textContent=data.title; document.getElementById('subtitle').textContent=`${data.xmlPath} · drag group panels to separate blocks`;
  const stats=[['Nodes',data.stats.nodes],['Edges',data.stats.edges],['Groups',data.frames.length],['Expressions',data.stats.withExpressions],['Conditions',data.stats.conditions],['Responses',data.stats.responses],['Includes',data.stats.includes],['Excludes',data.stats.excludes]];
  document.getElementById('stats').innerHTML=stats.map(([k,v])=>`<div class="stat"><strong>${v}</strong><span>${k}</span></div>`).join('');
}
function renderToggles() { document.getElementById('toggles').innerHTML=Object.entries(types).map(([type,cfg])=>`<label><input type="checkbox" data-type="${type}" ${state.visibleTypes[type]?'checked':''}> <span>${cfg.label}</span></label>`).join(''); document.querySelectorAll('#toggles input').forEach(input=>input.addEventListener('change',e=>{ state.visibleTypes[e.target.dataset.type]=e.target.checked; render(); })); }
function renderLegend() { document.getElementById('legend').innerHTML=Object.entries(types).map(([type,cfg])=>`<div class="legend-row"><span class="swatch" style="background:${cfg.color}"></span><span>${cfg.label}</span><span>${cfg.count}</span></div>`).join('')+`<div class="legend-row"><span class="swatch" style="background:#98a2b3"></span><span>Group panels are draggable</span><span>${data.frames.length}</span></div>`; }
function connectedEdges(nodeId) { return data.edges.filter(e=>e.source===nodeId||e.target===nodeId); }
function updateDetails(item) {
  if(!item) { details.innerHTML='<h2>Details</h2><p>Select a node, edge, or group panel. Drag group panels to move whole blocks.</p>'; edgeList.innerHTML=''; return; }
  if(item.source && item.target) { const cfg=types[item.type]; details.innerHTML=`<h2>Details</h2><h3><span class="badge" style="background:${cfg.color}">${cfg.label}</span>${esc(item.source)} → ${esc(item.target)}</h3><div class="kv"><div>Expression</div><div>${esc(item.expression||'—')}</div><div>Time</div><div>${esc(item.time||'—')}</div><div>Filter</div><div>${esc(item.filterLevel||'—')}</div><div>Link</div><div>${esc(item.link||'—')}</div></div>`; edgeList.innerHTML=''; return; }
  const n=item; const groupNote=n.isGroup?' draggable group panel':''; details.innerHTML=`<h2>Details</h2><h3>${esc(n.label)}</h3><div class="id">${esc(n.id)} · ${esc(n.type)}${groupNote} · sequence ${esc(n.sequence||'—')}</div><div class="kv"><div>Runtime</div><div>${n.included?'included':'not included'}${n.executed?', executed':''}${n.pending?', pending':''}</div><div>Parent</div><div>${esc(n.parent||'—')}</div><div>Roles</div><div>${esc((n.roles||[]).join(', ')||'—')}</div><div>Children</div><div>${children[n.id]?.length || 0}</div><div>Data</div><div>${esc((n.dataTypes||[]).join(', ')||'—')}</div></div>${n.description?`<div class="desc">${esc(n.description)}</div>`:''}`;
  const incident=connectedEdges(n.id); edgeList.innerHTML=incident.map(e=>{ const cfg=types[e.type]; const summary=`${e.source} → ${e.target}${e.expression?' ['+e.expression+']':''}${e.time?' time='+e.time:''}`; return `<div class="edge-item"><span class="badge" style="background:${cfg.color}">${cfg.label}</span>${esc(summary)}</div>`; }).join('') || '<div class="edge-item">No incident constraints.</div>';
}
function render() { renderFrames(); renderEdges(); renderNodes(); }
function startGroupDrag(ev, groupId) {
  ev.stopPropagation(); ev.preventDefault(); state.selectedGroup=groupId; state.selectedNode=groupId; state.selectedEdge=null; updateDetails(nodes.get(groupId));
  const startX=ev.clientX, startY=ev.clientY; const start=groupOffset(groupId); svg.classList.add('group-dragging');
  function move(e) { const dx=(e.clientX-startX)/state.scale, dy=(e.clientY-startY)/state.scale; state.groupOffsets[groupId]={x:start.x+dx,y:start.y+dy}; render(); }
  function up() { window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); svg.classList.remove('group-dragging'); render(); }
  window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); render();
}
function setupPanZoom() {
  let dragging=false,sx=0,sy=0,ox=0,oy=0;
  svg.addEventListener('pointerdown', e=>{ if(e.target.closest && e.target.closest('.frame')) return; dragging=true; sx=e.clientX; sy=e.clientY; ox=state.tx; oy=state.ty; svg.classList.add('dragging'); });
  svg.addEventListener('pointermove', e=>{ if(!dragging) return; state.tx=ox+e.clientX-sx; state.ty=oy+e.clientY-sy; updateTransform(); });
  svg.addEventListener('pointerup', ()=>{ dragging=false; svg.classList.remove('dragging'); }); svg.addEventListener('pointerleave', ()=>{ dragging=false; svg.classList.remove('dragging'); });
  svg.addEventListener('wheel', e=>{ e.preventDefault(); const rect=svg.getBoundingClientRect(); const mx=e.clientX-rect.left,my=e.clientY-rect.top; const old=state.scale; state.scale=Math.max(.08,Math.min(3,state.scale*Math.exp(-e.deltaY*.001))); state.tx=mx-(mx-state.tx)*(state.scale/old); state.ty=my-(my-state.ty)*(state.scale/old); updateTransform(); }, {passive:false});
  svg.addEventListener('click', ()=>{ state.selectedNode=null; state.selectedEdge=null; state.selectedGroup=null; updateDetails(null); render(); });
}
function focusGroup(groupId) {
  const f = frames.get(groupId);
  if (!f) return;
  const p = posFrame(f);
  const rect = svg.getBoundingClientRect();
  const pad = 52;
  const sx = (rect.width - pad * 2) / p.w;
  const sy = (rect.height - pad * 2) / p.h;
  state.scale = Math.max(0.1, Math.min(1.65, sx, sy));
  state.tx = pad - p.x * state.scale + (rect.width - p.w * state.scale - pad * 2) / 2;
  state.ty = pad - p.y * state.scale + (rect.height - p.h * state.scale - pad * 2) / 2;
  state.selectedGroup = groupId;
  state.selectedNode = groupId;
  state.selectedEdge = null;
  updateTransform();
  updateDetails(nodes.get(groupId));
  render();
}
function setupControls() {
  document.getElementById('fit').addEventListener('click',fit);
  document.getElementById('resetLayout').addEventListener('click',()=>{ state.groupOffsets={}; render(); fit(); });
  document.getElementById('focusA95').addEventListener('click',()=>focusGroup('A95'));
  document.getElementById('labels').addEventListener('click',e=>{ state.showLabels=!state.showLabels; e.currentTarget.classList.toggle('active',state.showLabels); render(); });
  document.getElementById('frames').addEventListener('click',e=>{ state.showFrames=!state.showFrames; e.currentTarget.classList.toggle('active',state.showFrames); render(); });
  document.getElementById('search').addEventListener('input',e=>{ state.search=e.target.value.trim(); render(); });
  document.getElementById('focusType').addEventListener('change',e=>{ state.focusType=e.target.value; render(); });
}
addMarkers(); renderStats(); renderToggles(); renderLegend(); setupControls(); setupPanZoom(); updateDetails(null); render(); fit(); window.addEventListener('resize',fit);
</script>
</body>
</html>
