name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            faq_search/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -t .
      - run: python scripts/check_repo.py
      - run: python -m pip install pip-audit
      - run: python -m pip_audit
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Built demo matches source
        run: git diff --exit-code -- ../static/demo && test -z "$(git ls-files --others --exclude-standard ../static/demo)"
